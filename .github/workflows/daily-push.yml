name: Daily Morning Push

on:
  schedule:
    # 这是UTC时间，0点代表北京时间早上8点。如需调整，请换算时差。
    - cron: '0 0 * * *'
  # 允许你手动触发工作流进行测试
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run main script
        env:
          PUSH_CHANNEL: ${{ secrets.PUSH_CHANNEL }}
          WECHAT_APPID: ${{ secrets.WECHAT_APPID }}
          WECHAT_SECRET: ${{ secrets.WECHAT_SECRET }}
          WECHAT_TEMPLATE_ID: ${{ secrets.WECHAT_TEMPLATE_ID }}
          WECHAT_USER_ID: ${{ secrets.WECHAT_USER_ID }}
          QWEATHER: ${{ secrets.QWEATHER }}
          CITY: ${{ secrets.CITY }}
        run: python main.py
